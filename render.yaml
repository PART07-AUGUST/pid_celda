services:
  - type: web
    name: pid-celda-dashboard
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./docker/Dockerfile.node-red
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /dashboard
    envVars:
      - key: FLOW_FILE
        value: flows.json
      - key: NODE_RED_DISABLE_EDITOR
        value: "1"
      - key: NODE_RED_CREDENTIAL_SECRET
        generateValue: true
