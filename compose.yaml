services:
  node-red:
    build:
      context: .
      dockerfile: docker/Dockerfile.node-red
    environment:
      FLOW_FILE: flows.json
    ports:
      - "${DASHBOARD_BIND:-0.0.0.0}:${DASHBOARD_PORT:-1881}:1880"
    volumes:
      - pid_celda_data:/data
    restart: unless-stopped

volumes:
  pid_celda_data:
